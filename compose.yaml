# This stack owns local data volumes. Production settings must never be used here.
name: ${ROMANA_LOCAL_COMPOSE_PROJECT:?Use make APP_ENV=local secrets-exec for the local Compose stack}
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: romanian
      POSTGRES_USER: ${PGUSER:?Load SOPS settings with make secrets-exec}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Load SOPS settings with make secrets-exec}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment: &minio-credentials
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Load SOPS settings with make secrets-exec}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Load SOPS settings with make secrets-exec}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30
  minio-init:
    image: quay.io/minio/mc:RELEASE.2024-11-21T17-21-54Z
    environment: *minio-credentials
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
        mc mb --ignore-existing local/courses
    depends_on:
      minio:
        condition: service_healthy
  migrate-files:
    profiles: [migration]
    image: quay.io/minio/mc:RELEASE.2024-11-21T17-21-54Z
    environment: *minio-credentials
    volumes:
      - course-files:/legacy:ro
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
        mc mirror /legacy local/courses/courses
    depends_on:
      minio-init:
        condition: service_completed_successfully
  app:
    build: .
    image: romanian:local
    restart: unless-stopped
    environment:
      APP_MODE: local
      PGHOST: postgres
      PGDATABASE: romanian
      PGUSER: ${PGUSER:?Load SOPS settings with make secrets-exec}
      PGPASSWORD: ${PGPASSWORD:?Load SOPS settings with make secrets-exec}
      PGSSLMODE: disable
      HTTP_ADDR: 0.0.0.0:8080
      COURSE_STORAGE_PROVIDER: s3
      COURSE_S3_ENDPOINT: http://minio:9000
      COURSE_STORAGE_BUCKET: courses
      COURSE_STORAGE_PREFIX: courses/
      COURSE_S3_REGION: us-east-1
      COURSE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:?Load SOPS settings with make secrets-exec}
      COURSE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Load SOPS settings with make secrets-exec}
      EXERCISE_API_URL: ${EXERCISE_API_URL:-}
      EXERCISE_API_KEY: ${EXERCISE_API_KEY:-}
      EXERCISE_API_MODEL: ${EXERCISE_API_MODEL:-}
      EXERCISE_API_EFFORT: ${EXERCISE_API_EFFORT:-}
      EXERCISE_API_EFFORT_FORMAT: ${EXERCISE_API_EFFORT_FORMAT:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      AUTH_LEGACY_GITHUB_ID: ${AUTH_LEGACY_GITHUB_ID:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  postgres-data:
  course-files:
  minio-data:
