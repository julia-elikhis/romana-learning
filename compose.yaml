name: romanian
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: romanian
      POSTGRES_USER: romanian
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U romanian -d romanian"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    image: romanian:local
    restart: unless-stopped
    environment:
      APP_MODE: local
      DATABASE_URL: postgres://romanian:local-development-only@postgres:5432/romanian?sslmode=disable
      HTTP_ADDR: 0.0.0.0:8080
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  postgres-data:
