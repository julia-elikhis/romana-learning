# Overlay for an existing NGINX ingress controller and cert-manager installation.
# Supply auth.baseURL from production APP_BASE_URL; host and TLS names follow it.
appMode: public
auth:
  existingSecret: github-auth
ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/tls-acme: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # The app accepts 20 MiB files; allow room for the multipart request envelope.
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    # Generation and Romanian review have a combined 120-second deadline.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
  tls:
    - secretName: romana-learning-tls
