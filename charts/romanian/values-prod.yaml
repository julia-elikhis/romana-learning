  tag: "20260910-4@sha256:a87579c62bb5baaa4dd399f108ba4462ae7e5ff591b285286d308789b2ed9c50"
appMode: public
auth:
  existingSecret: github-auth
database:
  mode: parameters
  existingSecret: romanian-database
generation:
  existingSecret: romanian-generation
storage:
  provider: gcs
  gcs:
    settingsSecret: google-storage
    workloadIdentity:
      # GKE supplies credentials through its metadata server.
      enabled: false
