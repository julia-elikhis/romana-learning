# Runtime Secrets must already exist in the production release namespace.
# The production renderer supplies identifiers from SOPS, plus the ingress overlay.
image:
  repository: elikhis/romana-learning
  tag: "20261021-4@sha256:02e85f39b12fad56019bc8a65b0ecdf5dac4d3c2f30f9517c4120f53decb51b2"
appMode: public
auth:
  existingSecret: github-auth
database:
  mode: parameters
  existingSecret: romanian-database
generation:
  existingSecret: romanian-generation
storage:
  provider: gcs
  gcs:
    settingsSecret: google-storage
    workloadIdentity:
      # GKE supplies credentials through its metadata server.
      enabled: false
