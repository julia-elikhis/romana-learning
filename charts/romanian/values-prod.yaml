  tag: "20260910-3@sha256:b934c0eaa020582f698a31de0c168fe966de296e18e6400f0e37424a764d9e1e"
appMode: public
auth:
  existingSecret: github-auth
database:
  mode: parameters
  existingSecret: romanian-database
generation:
  existingSecret: romanian-generation
storage:
  provider: gcs
  gcs:
    settingsSecret: google-storage
    workloadIdentity:
      # GKE supplies credentials through its metadata server.
      enabled: false
