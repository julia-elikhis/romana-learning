  tag: "20260910-1@sha256:d0412b68f51dc19db01cc184919ff8800b2345a450b42de4f9763ceaa49af1d6"
appMode: public
auth:
  existingSecret: github-auth
database:
  mode: parameters
  existingSecret: romanian-database
generation:
  existingSecret: romanian-generation
storage:
  provider: gcs
  gcs:
    settingsSecret: google-storage
    workloadIdentity:
      # GKE supplies credentials through its metadata server.
      enabled: false
