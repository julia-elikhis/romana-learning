apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "romanian.name" . }}
  labels:
    {{- include "romanian.labels" . | nindent 4 }}
data:
  APP_MODE: {{ .Values.appMode | quote }}
  HTTP_ADDR: "0.0.0.0:8080"
  {{- if eq .Values.database.mode "parameters" }}
  PGHOST: {{ .Values.database.host | quote }}
  PGPORT: {{ .Values.database.port | quote }}
  PGDATABASE: {{ .Values.database.name | quote }}
  PGSSLMODE: {{ .Values.database.sslMode | quote }}
  PGCONNECT_TIMEOUT: "5"
  {{- end }}
  {{- if .Values.database.tls.existingSecret }}
  PGSSLROOTCERT: "/etc/postgres/ca.crt"
  {{- end }}
  COURSE_STORAGE_PROVIDER: {{ .Values.storage.provider | quote }}
  {{- if eq .Values.storage.provider "filesystem" }}
  COURSE_STORAGE_PATH: {{ .Values.storage.filesystem.mountPath | quote }}
  {{- end }}
  {{- if eq .Values.storage.provider "gcs" }}
  COURSE_STORAGE_BUCKET: {{ .Values.storage.gcs.bucket | quote }}
  COURSE_STORAGE_PREFIX: {{ .Values.storage.gcs.prefix | quote }}
  {{- with .Values.storage.gcs.project }}
  GOOGLE_CLOUD_PROJECT: {{ . | quote }}
  {{- end }}
  {{- if .Values.storage.gcs.credentialsSecret }}
  GOOGLE_APPLICATION_CREDENTIALS: "/etc/google/credentials.json"
  {{- end }}
  {{- end }}
