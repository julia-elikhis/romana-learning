{{- with .Values.serviceAccount.gcpServiceAccount }}
{{- if not $.Values.serviceAccount.create }}
{{- fail "serviceAccount.gcpServiceAccount requires a chart-managed ServiceAccount; annotate an externally managed account through its owner" }}
{{- end }}
{{- $annotation := index $.Values.serviceAccount.annotations "iam.gke.io/gcp-service-account" }}
{{- if and $annotation (ne $annotation .) }}
{{- fail "serviceAccount.gcpServiceAccount conflicts with the Google service-account annotation" }}
{{- end }}
{{- end }}
{{- if eq .Values.database.mode "parameters" }}
{{- $_ := required "database.host is required in parameters mode" .Values.database.host }}
{{- if or (eq .Values.database.name "postgres") (hasPrefix "template" .Values.database.name) }}
{{- fail "Select the application's dedicated database, not a PostgreSQL maintenance/template database" }}
{{- end }}
{{- end }}
{{- if or .Values.ingress.enabled (eq .Values.appMode "public") }}
{{- $_ := required "Public deployment requires auth.existingSecret" .Values.auth.existingSecret }}
{{- if not (hasPrefix "https://" .Values.auth.baseURL) }}
{{- fail "Public deployment requires an HTTPS auth.baseURL" }}
{{- end }}
{{- end }}
{{- if .Values.ingress.enabled }}
{{- if not (regexMatch "^https://[a-z0-9]([a-z0-9.-]*[a-z0-9])?/?$" .Values.auth.baseURL) }}
{{- fail "Ingress requires auth.baseURL to be an HTTPS hostname without a port, path, query, or credentials" }}
{{- end }}
{{- $host := include "romanian.ingressHost" . }}
{{- if ne $host (get (urlParse .Values.auth.baseURL) "host") }}
{{- fail "ingress.host must match auth.baseURL for GitHub authentication" }}
{{- end }}
{{- $annotations := .Values.ingress.annotations }}
{{- if and (or (index $annotations "cert-manager.io/cluster-issuer") (index $annotations "cert-manager.io/issuer") (eq (index $annotations "kubernetes.io/tls-acme") "true")) (not .Values.ingress.tls) }}
{{- fail "cert-manager requires ingress.tls with a certificate secretName" }}
{{- end }}
{{- if .Values.ingress.tls }}
{{- $covered := false }}
{{- range .Values.ingress.tls }}
{{- if has $host (default (list $host) .hosts) }}
{{- $covered = true }}
{{- end }}
{{- end }}
{{- if not $covered }}
{{- fail "ingress.tls must include the ingress hostname" }}
{{- end }}
{{- end }}
{{- end }}
{{- if eq .Values.storage.provider "filesystem" }}
{{- $p := .Values.storage.filesystem.persistence }}
{{- if and $p.create $p.existingClaim }}
{{- fail "Choose either an existing course PVC or creation of a new claim, not both" }}
{{- end }}
{{- if and (not $p.create) (not $p.existingClaim) }}
{{- fail "Filesystem storage requires persistence.existingClaim or persistence.create=true" }}
{{- end }}
{{- if and (gt (int .Values.replicaCount) 1) (not (has "ReadWriteMany" $p.accessModes)) }}
{{- fail "Multiple filesystem replicas require a ReadWriteMany claim; keep replicaCount=1 for node disks" }}
{{- end }}
{{- if and (eq .Values.strategy.type "RollingUpdate") (not (has "ReadWriteMany" $p.accessModes)) }}
{{- fail "Use Recreate strategy with a single-writer course disk" }}
{{- end }}
{{- end }}
{{- if eq .Values.storage.provider "gcs" }}
{{- if not .Values.storage.gcs.settingsSecret }}
{{- $_ := required "storage.gcs.bucket is required for GCS" .Values.storage.gcs.bucket }}
{{- end }}
{{- if .Values.storage.gcs.workloadIdentity.enabled }}
{{- if .Values.storage.gcs.credentialsSecret }}
{{- fail "Workload Identity cannot be combined with a credential-file Secret" }}
{{- end }}
{{- $_ := required "storage.gcs.workloadIdentity.provider is required for federation" .Values.storage.gcs.workloadIdentity.provider }}
{{- $_ := required "Workload Identity requires an external_account configuration Secret" .Values.storage.gcs.workloadIdentity.credentialsSecret }}
{{- end }}
{{- end }}

{{- if eq .Values.storage.provider "s3" }}
{{- $_ := required "storage.s3.bucket is required for S3" .Values.storage.s3.bucket }}
{{- $_ := required "storage.s3.existingSecret is required for S3" .Values.storage.s3.existingSecret }}
{{- $_ := include "romanian.s3Endpoint" . }}
{{- end }}
{{- if .Values.minio.enabled }}
{{- $_ := required "minio.existingSecret is required; provide rootUser/rootPassword in a Secret" .Values.minio.existingSecret }}
{{- if ne .Values.storage.provider "s3" }}
{{- fail "Bundled MinIO requires storage.provider=s3" }}
{{- end }}
{{- if not .Values.minio.persistence.enabled }}
{{- fail "Bundled MinIO requires persistent storage" }}
{{- end }}
{{- end }}
