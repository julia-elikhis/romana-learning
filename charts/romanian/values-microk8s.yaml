# MicroK8s with the default Google bucket. Use values-minio.yaml for local object storage.
image:
  repository: romanian
  tag: microk8s
  pullPolicy: Never
database:
  mode: parameters
  host: postgres
  name: romanian_test
  sslMode: disable
  existingSecret: test-database
storage:
  provider: gcs
  gcs:
    settingsSecret: google-storage
    workloadIdentity:
      enabled: true
minio:
  enabled: false
  existingSecret: test-minio
  persistence:
    storageClass: microk8s-hostpath
    size: 5Gi
