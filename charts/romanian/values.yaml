replicaCount: 1
# Recreate avoids overlapping writers/volume attachments for a single-node disk.
strategy:
  type: Recreate
image:
  repository: romanian
  tag: local
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Both modes require authentication for materials and saved history. Anonymous grading is public.
# Public mode also requires configured GitHub OAuth and an HTTPS origin.
appMode: local
auth:
  existingSecret: ""
  baseURL: http://localhost:8080
database:
  # url: whole connection URL from a Secret (compatible with local mode).
  # parameters: explicit host/database/TLS settings, username/password in a Secret.
  mode: url
  existingSecret: romanian-database
  urlKey: DATABASE_URL
  host: ""
  port: 5432
  name: romanian
  usernameKey: username
  passwordKey: password
  sslMode: verify-full
  tls:
    existingSecret: ""
    caKey: ca.crt

# Original course files; metadata and exercise drafts are stored in Postgres.
storage:
  provider: gcs # disabled | filesystem | gcs | s3
  filesystem:
    mountPath: /data/courses
    persistence:
      existingClaim: ""
      create: false
      size: 10Gi
      # null: cluster default; "": no dynamic provisioning; otherwise class name.
      storageClass: null
      accessModes: [ReadWriteOnce]
      # Retain a chart-created claim on uninstall. Backups are managed separately.
      keep: true
  gcs:
    project: ""
    bucket: ""
    prefix: courses/
    # Contains GOOGLE_CLOUD_PROJECT, COURSE_STORAGE_BUCKET, COURSE_STORAGE_PREFIX.
    settingsSecret: google-storage
    workloadIdentity:
      # Enable for non-GKE Kubernetes federation. GKE uses its metadata server.
      enabled: false
      provider: "" # projects/NUMBER/locations/global/workloadIdentityPools/POOL/providers/PROVIDER
      credentialsSecret: google-workload-identity # external_account configuration, without a private key
    # Leave blank to use Application Default Credentials / Workload Identity.
    credentialsSecret: ""
    credentialsKey: credentials.json

  s3:
    # Leave empty to use the bundled MinIO service when minio.enabled=true.
    endpoint: ""
    bucket: courses
    prefix: courses/
    region: us-east-1
    existingSecret: ""
    accessKeyKey: accessKey
    secretKeyKey: secretKey

# Optional local object store. Use an existing Secret with rootUser/rootPassword.
minio:
  enabled: false
  mode: standalone
  replicas: 1
  existingSecret: ""
  image:
    repository: quay.io/minio/minio
    tag: RELEASE.2025-09-07T16-13-09Z
  mcImage:
    repository: quay.io/minio/mc
    tag: RELEASE.2024-11-21T17-21-54Z
  users: []
  buckets:
    - name: courses
      policy: none
      purge: false
  persistence:
    enabled: true
    size: 5Gi
    annotations:
      helm.sh/resource-policy: keep
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

# Existing Secret only: keep endpoint URLs and keys out of chart values.
generation:
  existingSecret: ""

serviceAccount:
  create: true
  name: ""
  # Deployment supplies the Google account from the encrypted GCS_SERVICE_ACCOUNT setting.
  gcpServiceAccount: ""
  annotations: {}
  automountServiceAccountToken: false

podAnnotations: {}

service:
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  # Empty: derive the host from auth.baseURL (supplied from production APP_BASE_URL).
  host: ""
  # Each entry needs secretName; omitted hosts default to the ingress host.
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: "1"
    memory: 256Mi
nodeSelector: {}
tolerations: []
affinity: {}
